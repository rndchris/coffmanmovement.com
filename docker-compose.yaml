version: '3.8'

services:
  portfolio-web:
    image: nginx:alpine
    container_name: coffman-portfolio
    ports:
      - "8080:80"
    volumes:
      # Mounts your current directory to Nginx's default public html folder
      # The :ro flag makes it read-only for security
      - ./web/public:/usr/share/nginx/html:ro
    restart: unless-stopped